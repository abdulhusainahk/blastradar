# Cross-repo edges that static parsing of THIS repo can't see, plus criticality
# flags. This is how BlastRadar knows an out-of-repo service consumes a shared
# artifact (the gap that lets AI-authored PRs ship "high blast radius" changes).
edges:
  - consumer: repo:mobile-bff       # lives in another repo, imports the network module
    depends_on: tfmodule:network
  - consumer: repo:web-frontend
    depends_on: helmchart:stream

critical:
  - service:payments
  - repo:mobile-bff

# Who to @-mention when their service lands in the blast radius (from CODEOWNERS
# when produced by `blastradar crawl`; hand-written here for the demo).
owners:
  repo:mobile-bff: ["@demo-org/mobile-team"]
  repo:web-frontend: ["@demo-org/frontend-team"]
  service:payments: ["@demo-org/payments-team"]
